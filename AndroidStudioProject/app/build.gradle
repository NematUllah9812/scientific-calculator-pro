plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scientific.calculator.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.scientific.calculator.pro"
        minSdk 21
        targetSdk 34
        versionCode 30
        versionName "3.0"
    }

    // Signing credentials are read from keystore.properties, which is NOT in
    // version control (see .gitignore). Copy keystore.properties.example to
    // keystore.properties and point it at your own key. Without it the release
    // build simply stays unsigned and you can sign it yourself later.
    signingConfigs {
        release {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only attach the signing config when keystore.properties supplied one.
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Intentionally dependency-free: the UI is a single inlined HTML asset
    // rendered by the platform WebView, so no AndroidX runtime is required.
}
